---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  annotations:
    caren.nutanix.com/cluster-uuid: 019c5a99-3bed-7760-afcd-9823b71939f1
  labels:
    cluster.x-k8s.io/provider: nutanix
    konvoy.d2iq.io/cluster-name: srikar-mgmt
    konvoy.d2iq.io/provider: nutanix
  name: srikar-mgmt
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
    services:
      cidrBlocks:
      - 10.96.0.0/12
  controlPlaneEndpoint:
    host: ""
    port: 0
  topology:
    class: nkp-nutanix-v2.17.0
    controlPlane:
      metadata: {}
      replicas: 3
    variables:
    - name: clusterConfig
      value:
        addons:
          ccm:
            credentials:
              secretRef:
                name: srikar-mgmt-pc-credentials
            strategy: HelmAddon
          clusterAutoscaler:
            strategy: HelmAddon
          cni:
            provider: Cilium
            strategy: HelmAddon
          cosi:
            strategy: HelmAddon
          csi:
            defaultStorage:
              provider: nutanix
              storageClassConfig: volume
            providers:
              nutanix:
                credentials:
                  secretRef:
                    name: srikar-mgmt-pc-credentials-for-csi
                storageClassConfigs:
                  volume:
                    allowExpansion: true
                    parameters:
                      csi.storage.k8s.io/fstype: ext4
                      description: CSI StorageClass nutanix-volume for srikar-mgmt
                      flashMode: DISABLED
                      hypervisorAttached: ENABLED
                      storageContainer: srikar
                      storageType: NutanixVolumes
                    reclaimPolicy: Delete
                    volumeBindingMode: WaitForFirstConsumer
                strategy: HelmAddon
            snapshotController:
              strategy: HelmAddon
          konnectorAgent:
            credentials:
              secretRef:
                name: srikar-mgmt-pc-credentials-for-konnector-agent
          nfd:
            strategy: HelmAddon
          serviceLoadBalancer:
            configuration:
              addressRanges:
              - end: 190.170.21.245
                start: 190.170.21.242
            provider: MetalLB
        controlPlane:
          autoRenewCertificates:
            daysBeforeExpiry: 180
          nodeRegistration:
            ignorePreflightErrors:
            - SystemVerification
          nutanix:
            machineDetails:
              additionalCategories:
              - key: srikar
                value: managementcp
              bootType: uefi
              cluster:
                name: NTNX-DC
                type: name
              image:
                name: nkp-rhel-9.6-1.34.1-20260128025639
                type: name
              memorySize: 16Gi
              project:
                name: srikar
                type: name
              subnets:
              - name: IPAM_VLAN_20
                type: name
              systemDiskSize: 150Gi
              vcpuSockets: 4
              vcpusPerSocket: 1
        dns:
          coreDNS: {}
        encryptionAtRest:
          providers:
          - secretbox: {}
        globalImageRegistryMirror:
          credentials:
            secretRef:
              name: srikar-mgmt-image-registry-mirror-credentials
          url: https://srikarharbor.kuberox.net/nkp-v-2.17
        kubeProxy:
          mode: disabled
        nutanix:
          controlPlaneEndpoint:
            host: 190.170.21.241
            port: 6443
            virtualIP:
              provider: KubeVIP
          prismCentralEndpoint:
            credentials:
              secretRef:
                name: srikar-mgmt-pc-credentials
            insecure: true
            url: https://190.170.10.209:9440
        users:
        - name: nkp
          sshAuthorizedKeys:
          - |
            ssh-rsa 
          sudo: ALL=(ALL) NOPASSWD:ALL
    version: v1.34.1
    workers:
      machineDeployments:
      - class: default-worker
        metadata:
          annotations:
            cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "4"
            cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "4"
        name: md-0
        variables:
          overrides:
          - name: workerConfig
            value:
              nodeRegistration:
                ignorePreflightErrors:
                - SystemVerification
              nutanix:
                machineDetails:
                  additionalCategories:
                  - key: srikar
                    value: managementwrk
                  bootType: uefi
                  cluster:
                    name: NTNX-DC
                    type: name
                  image:
                    name: nkp-rhel-9.6-1.34.1-20260128025639
                    type: name
                  memorySize: 32Gi
                  project:
                    name: srikar
                    type: name
                  subnets:
                  - name: IPAM_VLAN_20
                    type: name
                  systemDiskSize: 150Gi
                  vcpuSockets: 8
                  vcpusPerSocket: 1
