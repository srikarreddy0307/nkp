apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: host-based-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: app3.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3
                port:
                  number: 80
    - host: app4.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app4
                port:
                  number: 80

